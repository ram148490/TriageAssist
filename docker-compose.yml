services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: triageassist
      POSTGRES_PASSWORD: triageassist
      POSTGRES_DB: triageassist
    ports:
      # Loopback only: the database holds patient names/phone numbers and ships with a dev password.
      - "127.0.0.1:5432:5432"
    volumes:
      - triageassist_pgdata:/var/lib/postgresql/data

volumes:
  triageassist_pgdata:
